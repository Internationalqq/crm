# Include once inside the HTTPS server that proxies CRM and AutoBot.
location = /_pmbi_autobot_access {
    internal;
    proxy_pass http://127.0.0.1:8080/api/autobot/access-check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Origin $http_origin;
    proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
}

# Keep the historic prefixed worker URL and its proxy limits. Every endpoint
# in this Flask namespace checks the dedicated worker token. Unknown paths
# do not fall through to private pages. The unprefixed CRM proxy is unchanged.
location ^~ /autobot/api/agent-market/v1/ {
    auth_request off;
    client_max_body_size 100m;
    proxy_pass http://127.0.0.1:8765/api/agent-market/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
