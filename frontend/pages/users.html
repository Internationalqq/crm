<section class="page-head">
    <div>
        <p class="eyebrow">Администрирование</p>
        <h2>Пользователи и роли</h2>
        <p>Директор создает сотрудников, закупщиков и заказчиков с ограниченным доступом.</p>
    </div>
</section>

<section class="grid-2">
    <form class="card form-card" data-user-create-form>
        <h3>Создать пользователя</h3>
        <label>
            <span>Имя</span>
            <input name="name" required>
        </label>
        <label>
            <span>Внутренний логин</span>
            <input name="login" required>
        </label>
        <label>
            <span>Email для входа и восстановления</span>
            <input name="email" type="email" required>
        </label>
        <label>
            <span>Телефон</span>
            <input name="phone">
        </label>
        <label>
            <span>Стартовый пароль Clerk</span>
            <input name="password" type="password" minlength="10" required>
        </label>
        <label>
            <span>Основная роль</span>
            <select name="role" required>
                <option value="director">Директор</option>
                <option value="foreman">Прораб</option>
                <option value="purchaser">Закупщик/снабженец</option>
                <option value="financier">Ответственный за финплан</option>
                <option value="accountant">Бухгалтер</option>
                <option value="customer">Заказчик</option>
                <option value="admin">Администратор</option>
            </select>
        </label>
        <fieldset class="role-checks">
            <legend>Дополнительные роли</legend>
            <label><input type="checkbox" name="roles" value="director"> Директор</label>
            <label><input type="checkbox" name="roles" value="foreman"> Прораб</label>
            <label><input type="checkbox" name="roles" value="purchaser"> Закупщик/снабженец</label>
            <label><input type="checkbox" name="roles" value="financier"> Ответственный за финплан</label>
            <label><input type="checkbox" name="roles" value="accountant"> Бухгалтер</label>
            <label><input type="checkbox" name="roles" value="customer"> Заказчик</label>
        </fieldset>
        <div class="form-error" data-user-create-error></div>
        <button class="primary" type="submit">Создать</button>
    </form>
    <section class="card">
        <div class="card-head">
            <h3>Список пользователей</h3>
            <button class="ghost" type="button" data-users-refresh>Обновить</button>
        </div>
        <div data-users-list></div>
    </section>
</section>
