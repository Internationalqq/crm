<section class="page-head suppliers-hero-head">
    <div>
        <p class="eyebrow">Закупщик и подрядчики</p>
        <h2>Контрагенты и предложения</h2>
        <p>Кандидаты, обзвон, просчет, сравнение со сметой и выбор лучшего варианта по объекту.</p>
    </div>
</section>

<section class="stats-grid" data-suppliers-stats></section>

<section class="card suppliers-context" data-suppliers-context hidden></section>

<section class="card suppliers-page-shell">
    <div class="card-head suppliers-page-head">
        <div class="suppliers-page-title">
            <h3>Все предложения по объекту</h3>
            <label class="supplier-project-picker">
                <i data-lucide="building-2" aria-hidden="true"></i>
                <select class="search" data-suppliers-project></select>
            </label>
        </div>
        <button class="primary suppliers-create-button suppliers-create-button-panel" type="button" data-supplier-create-open>
            <i data-lucide="plus-circle" aria-hidden="true"></i>
            <span>Создать контрагента</span>
        </button>
    </div>
    <div class="suppliers-list" data-suppliers-list></div>
</section>

<div class="supplier-detail-modal hidden" data-supplier-detail-modal>
    <button class="supplier-detail-backdrop" type="button" data-supplier-detail-close aria-label="Закрыть"></button>
    <section class="supplier-detail-dialog" role="dialog" aria-modal="true" aria-label="Карточка контрагента">
        <div data-supplier-detail-body></div>
    </section>
</div>

<div class="supplier-create-modal hidden" data-supplier-create-modal>
    <button class="supplier-create-backdrop" type="button" data-supplier-create-close aria-label="Закрыть"></button>
    <section class="supplier-create-dialog" role="dialog" aria-modal="true" aria-label="Создание контрагента">
        <form class="card form-card supplier-form supplier-create-form" data-supplier-create-form>
            <button class="ghost compact user-create-close" type="button" data-supplier-create-close>Закрыть</button>
            <h3>Создать контрагента</h3>

            <label>
                <span>Объект</span>
                <select name="project_id" required data-supplier-projects></select>
            </label>
            <label>
                <span>Тип</span>
                <select name="candidate_type">
                    <option value="supplier">Поставщик</option>
                    <option value="contractor">Подрядчик</option>
                </select>
            </label>
            <label class="wide">
                <span>Название кандидата</span>
                <input name="candidate_name" required placeholder="Например: ООО СтройСнаб или Бригада Иванова">
            </label>
            <label>
                <span>Компания из справочника</span>
                <select name="company_id" data-supplier-companies>
                    <option value="">Без привязки</option>
                </select>
            </label>
            <label>
                <span>Материал / предмет</span>
                <select name="estimate_item_id" data-supplier-materials>
                    <option value="">Без привязки к смете</option>
                </select>
            </label>
            <label>
                <span>Источник</span>
                <select name="source_type">
                    <option value="manual">Ручной ввод</option>
                    <option value="avito">Avito</option>
                    <option value="other">Другой источник</option>
                </select>
            </label>
            <label>
                <span>Ссылка</span>
                <input name="source_url" placeholder="Ссылка на объявление или карточку">
            </label>
            <label>
                <span>Контакт</span>
                <input name="contact_name" placeholder="Имя контакта">
            </label>
            <label>
                <span>Телефон</span>
                <input name="phone" placeholder="+7...">
            </label>
            <label>
                <span>Цена за единицу</span>
                <input name="price" type="number" min="0" step="0.01">
            </label>
            <label>
                <span>Количество</span>
                <input name="qty" type="number" min="0" step="0.01">
            </label>
            <label>
                <span>Ед. изм.</span>
                <input name="unit" placeholder="шт / м / м2">
            </label>
            <label>
                <span>Статус</span>
                <select name="status">
                    <option value="new">Новый</option>
                    <option value="called">Обзвонен</option>
                    <option value="quoted">Просчитан</option>
                    <option value="selected">Выбран</option>
                    <option value="rejected">Отклонен</option>
                </select>
            </label>
            <label class="wide">
                <span>Комментарий</span>
                <textarea name="notes" rows="4" placeholder="Что ответили, условия, сроки поставки, что смутило"></textarea>
            </label>
            <div class="form-error" data-supplier-create-error></div>
            <button class="primary" type="submit">Сохранить контрагента</button>
        </form>
    </section>
</div>
