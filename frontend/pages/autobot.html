<section class="autobot-stage" data-autobot-url="{{autobot_url}}">
    <div data-autobot-content-root>
        <div class="autobot-embed-wrap">
            <div class="autobot-offline" data-autobot-offline hidden>
                <strong>AutoBot не отвечает</strong>
                <span>Проверь, что сервис AutoBot запущен, или открой его отдельно.</span>
                <a href="{{autobot_url}}/" target="_blank" rel="noopener noreferrer">Открыть AutoBot</a>
            </div>
            <iframe
                class="autobot-embed"
                src="{{autobot_url}}/"
                title="AutoBot"
                loading="lazy"
                referrerpolicy="no-referrer"
                allow="clipboard-read; clipboard-write; microphone"
            ></iframe>
        </div>
    </div>
</section>
