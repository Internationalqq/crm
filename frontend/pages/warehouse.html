<section class="page-head">
    <div>
        <p class="eyebrow">Склад</p>
        <h2>Склад компании</h2>
        <p>Здесь лежат материалы и инструменты до отправки на объект.</p>
    </div>
</section>

<section class="card warehouse-card">
    <div class="warehouse-head-actions">
        <label class="warehouse-search-field"><i data-lucide="search" aria-hidden="true"></i><input class="search" aria-label="Поиск по складу" placeholder="Найти материал или инструмент" data-warehouse-search></label>
        <button class="primary warehouse-add-button" type="button" data-warehouse-receipt-open><i data-lucide="package-plus" aria-hidden="true"></i><span>Принять на склад</span></button>
    </div>

    <div class="analysis-strip" data-warehouse-analysis>
        <div class="pmbi-skeleton-view pmbi-skeleton-view--stats" data-pmbi-skeleton="stats" aria-hidden="true">
            <span class="pmbi-skeleton-item"><i></i><i></i></span>
            <span class="pmbi-skeleton-item"><i></i><i></i></span>
        </div>
    </div>

    <details class="warehouse-filter-box">
        <summary><i data-lucide="list-filter" aria-hidden="true"></i><span>Фильтры</span><i data-lucide="chevron-down" aria-hidden="true"></i></summary>
        <div class="warehouse-toolbar">
            <select class="search" data-warehouse-type-filter aria-label="Фильтр по типу складской позиции">
                <option value="all">Материалы и инструменты</option>
                <option value="material">Только материалы</option>
                <option value="tool">Только инструменты</option>
            </select>
            <select class="search" data-warehouse-category-filter aria-label="Фильтр по категории">
                <option value="all">Все категории</option>
            </select>
            <select class="search" data-warehouse-stock-filter aria-label="Фильтр по остатку">
                <option value="all">Любой остаток</option>
                <option value="available">Только в наличии</option>
                <option value="empty">Только закончившиеся</option>
            </select>
        </div>
    </details>

    <div data-warehouse-summary class="warehouse-ledger">
        <div class="pmbi-skeleton-view pmbi-skeleton-view--table" data-pmbi-skeleton="table" aria-hidden="true">
            <span class="pmbi-skeleton-item"><i></i><i></i><i></i><i></i></span>
        </div>
    </div>
</section>

<div class="warehouse-transfer-modal" data-warehouse-transfer-modal hidden>
    <button class="warehouse-transfer-backdrop" type="button" data-warehouse-transfer-close aria-label="Закрыть"></button>
    <section class="warehouse-transfer-dialog" role="dialog" aria-modal="true" aria-labelledby="warehouse-transfer-title">
        <div class="card-head">
            <div>
                <span class="section-label">Расход</span>
                <h3 id="warehouse-transfer-title">Выдать со склада</h3>
            </div>
            <button class="ghost compact" type="button" data-warehouse-transfer-close>Закрыть</button>
        </div>
        <div class="warehouse-transfer-item" data-warehouse-transfer-item></div>
        <form class="warehouse-form" data-warehouse-transfer-form>
            <input name="warehouse_item_id" type="hidden">
            <label class="wide">
                <span>Объект</span>
                <select name="project_id" required data-warehouse-transfer-projects></select>
            </label>
            <label>
                <span>Количество</span>
                <input name="qty" type="number" min="0.01" step="0.01" required>
            </label>
            <label>
                <span>Доступно</span>
                <input name="available" type="text" readonly>
            </label>
            <label class="wide">
                <span>Комментарий</span>
                <input name="comment" placeholder="Например: передано бригаде на монтаж">
            </label>
            <div class="form-error" data-warehouse-transfer-error role="alert" aria-atomic="true"></div>
            <button class="primary" type="submit">Выдать на объект</button>
        </form>
    </section>
</div>

<div class="warehouse-transfer-modal" data-warehouse-receipt-modal hidden>
    <button class="warehouse-transfer-backdrop" type="button" data-warehouse-receipt-close aria-label="Закрыть"></button>
    <section class="warehouse-transfer-dialog warehouse-receipt-dialog" role="dialog" aria-modal="true" aria-labelledby="warehouse-receipt-title">
        <div class="card-head">
            <div>
                <span class="section-label">Приход</span>
                <h3 id="warehouse-receipt-title">Принять на склад</h3>
            </div>
            <button class="ghost compact" type="button" data-warehouse-receipt-close>Закрыть</button>
        </div>

        <div class="warehouse-mode-tabs" data-warehouse-receipt-mode>
            <label><input type="radio" name="warehouse_receipt_mode" value="manual" checked> Новый приход</label>
            <label><input type="radio" name="warehouse_receipt_mode" value="return"> Возврат с объекта</label>
        </div>

        <div class="warehouse-receipt-body">
            <form class="warehouse-form" data-warehouse-manual-receipt-form>
                <input name="warehouse_item_id" type="hidden">
                <label>
                    <span>Тип</span>
                    <select name="item_type" required>
                        <option value="material">Материал</option>
                        <option value="tool">Инструмент</option>
                    </select>
                </label>
                <label class="wide warehouse-name-field">
                    <span>Наименование</span>
                    <input name="name" required autocomplete="off" placeholder="Начните вводить название" data-warehouse-manual-name>
                    <div class="warehouse-suggest-list" data-warehouse-manual-suggestions hidden></div>
                </label>
                <label>
                    <span>Количество</span>
                    <input name="qty" type="number" min="0.01" step="0.01" required>
                </label>
                <label>
                    <span>Ед. изм.</span>
                    <select name="unit" required>
                        <option value="шт">шт</option>
                        <option value="м">метров</option>
                        <option value="кг">кг</option>
                        <option value="рулон">рулон</option>
                        <option value="компл">компл</option>
                    </select>
                </label>
                <label data-warehouse-tool-status hidden>
                    <span>Статус</span>
                    <select name="condition_status">
                        <option value="Новый">Новый</option>
                        <option value="Б/У">Б/У</option>
                    </select>
                </label>
                <div class="form-error" data-warehouse-manual-receipt-error role="alert" aria-atomic="true"></div>
                <button class="primary" type="submit">Добавить на склад</button>
            </form>

            <form class="warehouse-form" data-warehouse-return-form hidden>
                <label class="wide">
                    <span>Объект</span>
                    <select name="project_id" required data-warehouse-return-projects></select>
                </label>
                <label class="wide">
                    <span>Материал / инструмент</span>
                    <select name="estimate_item_id" required data-warehouse-return-materials disabled>
                        <option value="">Сначала выберите объект</option>
                    </select>
                </label>
                <label>
                    <span>Количество к возврату</span>
                    <input name="qty" type="number" min="0.01" step="0.01" required disabled>
                </label>
                <div class="warehouse-return-available" data-warehouse-return-available>Доступно для возврата: выберите позицию</div>
                <div class="form-error" data-warehouse-return-error role="alert" aria-atomic="true"></div>
                <button class="primary" type="submit">Вернуть на склад</button>
            </form>
        </div>
    </section>
</div>
