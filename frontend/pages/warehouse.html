<section class="page-head">
    <div>
        <p class="eyebrow">Склад</p>
        <h2>Внутренний склад</h2>
        <p>Материалы и инструменты компании с быстрым поиском, фильтрами и выдачей на объекты.</p>
    </div>
</section>

<section class="card warehouse-card">
    <div class="card-head warehouse-head">
        <div>
            <span class="section-label">Остатки</span>
            <h3>Материалы и инструменты</h3>
        </div>
        <div class="warehouse-head-actions">
            <input class="search" placeholder="Поиск по названию, артикулу или категории" data-warehouse-search>
            <button class="primary warehouse-add-button" type="button" data-warehouse-receipt-open>+ Добавить / Вернуть на склад</button>
        </div>
    </div>

    <div class="analysis-strip" data-warehouse-analysis></div>

    <div class="warehouse-toolbar">
        <select class="search" data-warehouse-type-filter>
            <option value="all">Все типы</option>
            <option value="material">Материалы</option>
            <option value="tool">Инструменты</option>
        </select>
        <select class="search" data-warehouse-category-filter>
            <option value="all">Все категории</option>
        </select>
        <select class="search" data-warehouse-stock-filter>
            <option value="all">Все остатки</option>
            <option value="available">В наличии</option>
            <option value="empty">Нет остатка</option>
        </select>
    </div>

    <div data-warehouse-summary class="warehouse-ledger"></div>
</section>

<div class="warehouse-transfer-modal" data-warehouse-transfer-modal hidden>
    <button class="warehouse-transfer-backdrop" type="button" data-warehouse-transfer-close aria-label="Закрыть"></button>
    <section class="warehouse-transfer-dialog">
        <div class="card-head">
            <div>
                <span class="section-label">Выдача</span>
                <h3>Выдать на объект</h3>
            </div>
            <button class="ghost compact" type="button" data-warehouse-transfer-close>Закрыть</button>
        </div>
        <div class="warehouse-transfer-item" data-warehouse-transfer-item></div>
        <form class="warehouse-form" data-warehouse-transfer-form>
            <input name="warehouse_item_id" type="hidden">
            <label class="wide">
                <span>Объект</span>
                <select name="project_id" required data-warehouse-transfer-projects></select>
            </label>
            <label>
                <span>Количество</span>
                <input name="qty" type="number" min="0.01" step="0.01" required>
            </label>
            <label>
                <span>Доступно</span>
                <input name="available" type="text" readonly>
            </label>
            <label class="wide">
                <span>Комментарий</span>
                <input name="comment" placeholder="Например: передано бригаде на монтаж">
            </label>
            <div class="form-error" data-warehouse-transfer-error></div>
            <button class="primary" type="submit">Подтвердить</button>
        </form>
    </section>
</div>

<div class="warehouse-transfer-modal" data-warehouse-receipt-modal hidden>
    <button class="warehouse-transfer-backdrop" type="button" data-warehouse-receipt-close aria-label="Закрыть"></button>
    <section class="warehouse-transfer-dialog warehouse-receipt-dialog">
        <div class="card-head">
            <div>
                <span class="section-label">Приход</span>
                <h3>Добавить / Вернуть на склад</h3>
            </div>
            <button class="ghost compact" type="button" data-warehouse-receipt-close>Закрыть</button>
        </div>

        <div class="warehouse-mode-tabs" data-warehouse-receipt-mode>
            <label><input type="radio" name="warehouse_receipt_mode" value="manual" checked> Вручную</label>
            <label><input type="radio" name="warehouse_receipt_mode" value="return"> С объекта (Возврат)</label>
        </div>

        <div class="warehouse-receipt-body">
            <form class="warehouse-form" data-warehouse-manual-receipt-form>
                <input name="warehouse_item_id" type="hidden">
                <label>
                    <span>Тип</span>
                    <select name="item_type" required>
                        <option value="material">Материал</option>
                        <option value="tool">Инструмент</option>
                    </select>
                </label>
                <label class="wide warehouse-name-field">
                    <span>Наименование</span>
                    <input name="name" required autocomplete="off" placeholder="Начните вводить название" data-warehouse-manual-name>
                    <div class="warehouse-suggest-list" data-warehouse-manual-suggestions hidden></div>
                </label>
                <label>
                    <span>Количество</span>
                    <input name="qty" type="number" min="0.01" step="0.01" required>
                </label>
                <label>
                    <span>Ед. изм.</span>
                    <select name="unit" required>
                        <option value="шт">шт</option>
                        <option value="м">метров</option>
                        <option value="кг">кг</option>
                        <option value="рулон">рулон</option>
                        <option value="компл">компл</option>
                    </select>
                </label>
                <label data-warehouse-tool-status hidden>
                    <span>Статус</span>
                    <select name="condition_status">
                        <option value="Новый">Новый</option>
                        <option value="Б/У">Б/У</option>
                    </select>
                </label>
                <div class="form-error" data-warehouse-manual-receipt-error></div>
                <button class="primary" type="submit">Подтвердить</button>
            </form>

            <form class="warehouse-form" data-warehouse-return-form hidden>
                <label class="wide">
                    <span>Объект</span>
                    <select name="project_id" required data-warehouse-return-projects></select>
                </label>
                <label class="wide">
                    <span>Материал / инструмент</span>
                    <select name="estimate_item_id" required data-warehouse-return-materials disabled>
                        <option value="">Сначала выберите объект</option>
                    </select>
                </label>
                <label>
                    <span>Количество к возврату</span>
                    <input name="qty" type="number" min="0.01" step="0.01" required disabled>
                </label>
                <div class="warehouse-return-available" data-warehouse-return-available>Доступно для возврата: выберите позицию</div>
                <div class="form-error" data-warehouse-return-error></div>
                <button class="primary" type="submit">Подтвердить</button>
            </form>
        </div>
    </section>
</div>
