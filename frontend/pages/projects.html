<section class="page-head" data-project-overview-section>
    <div>
        <p class="eyebrow">Центр работы</p>
        <h2>Объекты строительства</h2>
        <p>Живой прогресс объекта, материалы по смете, остатки и нехватка.</p>
    </div>
    <button class="primary" type="button" data-open-project-create>Создать объект</button>
</section>

<section class="card" data-project-create-card data-project-overview-section hidden>
    <div class="card-head">
        <h3>Новый объект</h3>
        <button class="ghost" type="button" data-close-project-create>Закрыть</button>
    </div>
    <form class="project-form" data-project-create-form>
        <label>
            <span>Название</span>
            <input name="title" required placeholder="Например: объект по смете">
        </label>
        <label>
            <span>Заказчик</span>
            <input name="client_name" required placeholder="ООО Заказчик">
        </label>
        <label class="wide">
            <span>Адрес</span>
            <input name="address" required placeholder="Город, улица, дом">
        </label>
        <label>
            <span>Договор</span>
            <input name="contract_no" placeholder="PM-2026-001">
        </label>
        <input name="budget" type="hidden" value="0">
        <label>
            <span>Старт</span>
            <input name="started_at" type="date">
        </label>
        <label>
            <span>Дедлайн</span>
            <input name="deadline_at" type="date">
        </label>
        <div class="form-error" data-project-create-error></div>
        <button class="primary" type="submit">Создать</button>
    </form>
</section>

<section class="card" data-project-overview-section>
    <div class="card-head">
        <h3>Список объектов</h3>
        <input class="search" placeholder="Поиск по объектам" data-project-search>
    </div>
    <div class="projects-grid" data-projects-list>
        <div class="pmbi-skeleton-view pmbi-skeleton-view--cards" data-pmbi-skeleton="cards" aria-hidden="true">
            <span class="pmbi-skeleton-item"><i></i><i></i><i></i><i></i></span>
            <span class="pmbi-skeleton-item"><i></i><i></i><i></i><i></i></span>
        </div>
    </div>
</section>
<section class="card" data-project-detail hidden>
    <div class="project-detail-nav">
        <a class="project-back-button" href="/app/projects" aria-label="Назад к объектам" title="Назад к объектам">
            <i data-lucide="arrow-left" aria-hidden="true"></i>
        </a>
        <div class="project-tab-cluster">
            <div class="tabs">
                <button class="tab active" data-tab="overview"><i data-lucide="layout-dashboard" aria-hidden="true"></i><span>Главное</span></button>
                <button class="tab" data-tab="schedule"><i data-lucide="hammer" aria-hidden="true"></i><span>Работы</span></button>
                <button class="tab" data-tab="warehouse-control"><i data-lucide="boxes" aria-hidden="true"></i><span>Материалы</span></button>
                <button class="tab" data-tab="finance"><i data-lucide="wallet" aria-hidden="true"></i><span>Деньги</span></button>
                <button class="tab" data-tab="documents"><i data-lucide="folder-open" aria-hidden="true"></i><span>Документы</span></button>
            </div>
            <details class="project-more-menu" data-project-more-menu>
                <summary aria-label="Дополнительные разделы"><i data-lucide="ellipsis" aria-hidden="true"></i><span>Ещё</span></summary>
                <div class="project-nav-menu project-more-menu-list">
                    <button class="tab" data-tab="tasks"><i data-lucide="list-checks" aria-hidden="true"></i><span><b>Задачи</b><small>Кто, что и к какому сроку</small></span></button>
                    <button class="tab" data-tab="reports"><i data-lucide="notebook-tabs" aria-hidden="true"></i><span><b>Отчеты</b><small>Ежедневный факт по объекту</small></span></button>
                    <button class="tab" data-tab="calendar"><i data-lucide="calendar-days" aria-hidden="true"></i><span><b>Календарь</b><small>Поставки и сроки</small></span></button>
                    <button class="tab" data-tab="production-schedule"><i data-lucide="calendar-range" aria-hidden="true"></i><span><b>График производства</b><small>Детальный производственный план</small></span></button>
                    <button class="tab" data-tab="estimate-reconciliation"><i data-lucide="clipboard-check" aria-hidden="true"></i><span><b>Сверка сметы</b><small>Исходные данные и расхождения</small></span></button>
                </div>
            </details>
        </div>
        <details class="project-add-menu" data-project-add-menu>
            <summary><i data-lucide="plus" aria-hidden="true"></i><span>Добавить</span></summary>
            <div class="project-nav-menu project-add-menu-list">
                <button type="button" data-project-quick-action="report"><i data-lucide="notebook-pen" aria-hidden="true"></i><span><b>Отчет за день</b><small>Работы, люди, техника и проблемы</small></span></button>
                <button type="button" data-project-quick-action="document"><i data-lucide="scan-line" aria-hidden="true"></i><span><b>Документ</b><small>Фото, PDF, накладная или путевой</small></span></button>
                <button type="button" data-project-quick-action="invoice"><i data-lucide="receipt-text" aria-hidden="true"></i><span><b>Счёт</b><small>Передать в платёжный календарь</small></span></button>
                <button type="button" data-project-quick-action="task"><i data-lucide="list-plus" aria-hidden="true"></i><span><b>Задачу</b><small>Ответственный и срок</small></span></button>
                <button type="button" data-project-quick-action="material"><i data-lucide="package-plus" aria-hidden="true"></i><span><b>Движение материала</b><small>Приход, расход или возврат</small></span></button>
            </div>
        </details>
    </div>
    <div class="tab-panel active" data-panel="overview"></div>
    <div class="tab-panel" data-panel="schedule"></div>
    <div class="tab-panel" data-panel="estimate-reconciliation"></div>
    <div class="tab-panel" data-panel="warehouse-control"></div>
    <div class="tab-panel" data-panel="calendar"></div>
    <div class="tab-panel" data-panel="production-schedule"></div>
    <div class="tab-panel" data-panel="reports"></div>
    <div class="tab-panel" data-panel="tasks"></div>
    <div class="tab-panel" data-panel="finance"></div>
    <div class="tab-panel" data-panel="documents"></div>
    <div class="tab-panel" data-panel="chat"></div>
    <div class="tab-panel" data-panel="ai"></div>
</section>
