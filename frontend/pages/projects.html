<section class="page-head" data-project-overview-section>
    <div>
        <p class="eyebrow">Центр работы</p>
        <h2>Объекты строительства</h2>
        <p>Живой прогресс объекта, материалы по смете, остатки и нехватка.</p>
    </div>
    <button class="primary" type="button" data-open-project-create>Создать объект</button>
</section>

<section class="card" data-project-create-card data-project-overview-section hidden>
    <div class="card-head">
        <h3>Новый объект</h3>
        <button class="ghost" type="button" data-close-project-create>Закрыть</button>
    </div>
    <form class="project-form" data-project-create-form>
        <label>
            <span>Название</span>
            <input name="title" required placeholder="Например: объект по смете">
        </label>
        <label>
            <span>Компания</span>
            <select name="own_legal_entity_id" data-project-own-company required>
                <option value="">Загрузка компаний…</option>
            </select>
        </label>
        <label>
            <span>Заказчик</span>
            <input name="client_name" required placeholder="ООО Заказчик">
        </label>
        <label class="wide">
            <span>Адрес</span>
            <input name="address" required placeholder="Город, улица, дом">
        </label>
        <label>
            <span>Договор</span>
            <input name="contract_no" placeholder="PM-2026-001">
        </label>
        <input name="budget" type="hidden" value="0">
        <label>
            <span>Старт</span>
            <input name="started_at" type="date">
        </label>
        <label>
            <span>Дедлайн</span>
            <input name="deadline_at" type="date">
        </label>
        <div class="form-error" data-project-create-error role="alert" aria-atomic="true"></div>
        <button class="primary" type="submit">Создать</button>
    </form>
</section>

<section class="card" data-project-overview-section>
    <div class="card-head">
        <h3>Список объектов</h3>
        <input class="search" aria-label="Поиск по объектам" placeholder="Поиск по объектам" data-project-search>
    </div>
    <div class="project-company-filter" data-project-company-filter role="group" aria-label="Фильтр объектов по компании">
        <button class="is-active" type="button" data-project-company-filter-value="all" aria-pressed="true"><span>Все</span><b data-project-company-count="all">0</b></button>
        <button type="button" data-project-company-filter-value="uess" aria-pressed="false"><span>УЭСС</span><b data-project-company-count="uess">0</b></button>
        <button type="button" data-project-company-filter-value="pm" aria-pressed="false"><span>ПМ</span><b data-project-company-count="pm">0</b></button>
        <button type="button" data-project-company-filter-value="strategy" aria-pressed="false"><span>Стратегия</span><b data-project-company-count="strategy">0</b></button>
    </div>
    <div class="projects-grid" data-projects-list>
        <div class="pmbi-skeleton-view pmbi-skeleton-view--cards" data-pmbi-skeleton="cards" aria-hidden="true">
            <span class="pmbi-skeleton-item"><i></i><i></i><i></i><i></i></span>
            <span class="pmbi-skeleton-item"><i></i><i></i><i></i><i></i></span>
        </div>
    </div>
</section>
<section class="card" data-project-detail hidden>
    <div class="project-detail-nav">
        <a class="project-back-button" href="/app/projects" aria-label="Назад к объектам" title="Назад к объектам">
            <i data-lucide="arrow-left" aria-hidden="true"></i>
        </a>
        <div class="project-tab-cluster">
            <div class="tabs" role="tablist" aria-label="Разделы объекта">
                <button class="tab active" type="button" role="tab" id="project-tab-overview" data-tab="overview" aria-controls="project-panel-overview" aria-selected="true" aria-current="page"><i data-lucide="layout-dashboard" aria-hidden="true"></i><span>Сводка</span></button>
                <button class="tab" type="button" role="tab" id="project-tab-schedule" data-tab="schedule" aria-controls="project-panel-schedule" aria-selected="false" tabindex="-1"><i data-lucide="hammer" aria-hidden="true"></i><span>Работы</span></button>
                <button class="tab" type="button" role="tab" id="project-tab-warehouse-control" data-tab="warehouse-control" aria-controls="project-panel-warehouse-control" aria-selected="false" tabindex="-1"><i data-lucide="boxes" aria-hidden="true"></i><span>Материалы</span></button>
                <button class="tab" type="button" role="tab" id="project-tab-tasks" data-tab="tasks" aria-controls="project-panel-tasks" aria-selected="false" tabindex="-1"><i data-lucide="list-checks" aria-hidden="true"></i><span>Задачи</span></button>
                <button class="tab" type="button" role="tab" id="project-tab-reports" data-tab="reports" aria-controls="project-panel-reports" aria-selected="false" tabindex="-1"><i data-lucide="notebook-tabs" aria-hidden="true"></i><span>Журнал</span></button>
                <button class="tab" type="button" role="tab" id="project-tab-documents" data-tab="documents" aria-controls="project-panel-documents" aria-selected="false" tabindex="-1"><i data-lucide="folder-open" aria-hidden="true"></i><span>Документы</span></button>
                <button class="tab" type="button" role="tab" id="project-tab-finance" data-tab="finance" aria-controls="project-panel-finance" aria-selected="false" tabindex="-1"><i data-lucide="wallet" aria-hidden="true"></i><span>Деньги</span></button>
                <button class="tab" type="button" role="tab" id="project-tab-calendar" data-tab="calendar" aria-controls="project-panel-calendar" aria-selected="false" tabindex="-1"><i data-lucide="calendar-days" aria-hidden="true"></i><span>Календарь</span></button>
                <button class="tab" type="button" role="tab" id="project-tab-production-schedule" data-tab="production-schedule" aria-controls="project-panel-production-schedule" aria-selected="false" tabindex="-1"><i data-lucide="calendar-range" aria-hidden="true"></i><span>График производства</span></button>
                <button class="tab" type="button" role="tab" id="project-tab-estimate-reconciliation" data-tab="estimate-reconciliation" aria-controls="project-panel-estimate-reconciliation" aria-selected="false" tabindex="-1"><i data-lucide="clipboard-check" aria-hidden="true"></i><span>Сверка импорта</span></button>
            </div>
        </div>
        <button class="project-report-primary" type="button" data-project-quick-action="report" aria-label="Создать отчёт за сегодня" title="Создать отчёт за сегодня">
            <i data-lucide="notebook-pen" aria-hidden="true"></i><span>Отчёт за сегодня</span>
        </button>
        <details class="project-add-menu" data-project-add-menu>
            <summary aria-label="Добавить событие по объекту" title="Добавить событие"><i data-lucide="plus" aria-hidden="true"></i><span>Добавить</span></summary>
            <div class="project-nav-menu project-add-menu-list">
                <button type="button" data-project-quick-action="document" data-document-type="photo_report"><i data-lucide="camera" aria-hidden="true"></i><span><b>Фото с объекта</b><small>Зафиксировать результат или проблему</small></span></button>
                <button type="button" data-project-quick-action="material"><i data-lucide="package-plus" aria-hidden="true"></i><span><b>Движение материала</b><small>Приход, расход или возврат</small></span></button>
                <button type="button" data-project-quick-action="task"><i data-lucide="list-plus" aria-hidden="true"></i><span><b>Задачу</b><small>Ответственный и срок</small></span></button>
                <button type="button" data-project-quick-action="document"><i data-lucide="scan-line" aria-hidden="true"></i><span><b>Документ</b><small>Фото, PDF, накладная или путевой</small></span></button>
                <button type="button" data-project-quick-action="invoice"><i data-lucide="receipt-text" aria-hidden="true"></i><span><b>Счёт</b><small>Передать в платёжный календарь</small></span></button>
            </div>
        </details>
    </div>
    <nav class="project-mobile-capture" aria-label="Быстрые действия по объекту">
        <button type="button" data-project-quick-action="document" data-document-type="photo_report"><i data-lucide="camera" aria-hidden="true"></i><span>Фото</span></button>
        <button class="is-primary" type="button" data-project-quick-action="report" data-report-start-voice><i data-lucide="mic" aria-hidden="true"></i><span>Отчёт</span></button>
        <button type="button" data-project-quick-action="material"><i data-lucide="package-plus" aria-hidden="true"></i><span>Материал</span></button>
    </nav>
    <div class="tab-panel active" id="project-panel-overview" role="tabpanel" aria-labelledby="project-tab-overview" data-panel="overview"></div>
    <div class="tab-panel" id="project-panel-schedule" role="tabpanel" aria-labelledby="project-tab-schedule" data-panel="schedule" hidden></div>
    <div class="tab-panel" id="project-panel-estimate-reconciliation" role="tabpanel" aria-labelledby="project-tab-estimate-reconciliation" data-panel="estimate-reconciliation" hidden></div>
    <div class="tab-panel" id="project-panel-warehouse-control" role="tabpanel" aria-labelledby="project-tab-warehouse-control" data-panel="warehouse-control" hidden></div>
    <div class="tab-panel" id="project-panel-calendar" role="tabpanel" aria-labelledby="project-tab-calendar" data-panel="calendar" hidden></div>
    <div class="tab-panel" id="project-panel-production-schedule" role="tabpanel" aria-labelledby="project-tab-production-schedule" data-panel="production-schedule" hidden></div>
    <div class="tab-panel" id="project-panel-reports" role="tabpanel" aria-labelledby="project-tab-reports" data-panel="reports" hidden></div>
    <div class="tab-panel" id="project-panel-tasks" role="tabpanel" aria-labelledby="project-tab-tasks" data-panel="tasks" hidden></div>
    <div class="tab-panel" id="project-panel-finance" role="tabpanel" aria-labelledby="project-tab-finance" data-panel="finance" hidden></div>
    <div class="tab-panel" id="project-panel-documents" role="tabpanel" aria-labelledby="project-tab-documents" data-panel="documents" hidden></div>
    <div class="tab-panel" data-panel="chat"></div>
    <div class="tab-panel" data-panel="ai"></div>
</section>
