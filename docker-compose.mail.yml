# Receiving-only while HOSTKEY SMTP is blocked. Mac AutoBot stays disabled.
# Remove --inbox-only only after successful SMTP/IMAP check and send acceptance.
services:
  autobot-mail:
    image: crm-autobot:latest
    container_name: pmbi-autobot-mail
    profiles: [server-mail]
    init: true
    command: [python, -m, autobot.buyer_mail_service, run, --config, /run/autobot-mail/config.json, --inbox-only]
    volumes:
      - /opt/crm-secrets/autobot-mail:/run/autobot-mail:ro
      - /opt/code/auto_bot/data/mail-transport:/var/lib/autobot-mail
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -m, autobot.buyer_mail_service, status, --config, /run/autobot-mail/config.json]
      interval: 60s
      timeout: 5s
      start_period: 90s
      retries: 3
    restart: unless-stopped
