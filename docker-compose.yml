services:
  crm:
    build:
      context: .
    container_name: pmbi-crm
    environment:
      PMBI_HOST: 0.0.0.0
      PMBI_PORT: 8080
      PMBI_ADMIN_PASSWORD: ${PMBI_ADMIN_PASSWORD:-}
      PMBI_PUBLIC_BASE_URL: ${PMBI_PUBLIC_BASE_URL:-http://127.0.0.1:8080}
      PMBI_TRUST_PROXY_HEADERS: ${PMBI_TRUST_PROXY_HEADERS:-0}
      PMBI_FORCE_SECURE_COOKIES: ${PMBI_FORCE_SECURE_COOKIES:-0}
      PMBI_AUTOBOT_BASE_URL: ${PMBI_AUTOBOT_BASE_URL:-http://127.0.0.1:8765}
      PMBI_AUTOBOT_INTERNAL_URL: ${PMBI_AUTOBOT_INTERNAL_URL:-http://autobot:8765}
      PMBI_SMTP_HOST: ${PMBI_SMTP_HOST:-}
      PMBI_SMTP_PORT: ${PMBI_SMTP_PORT:-587}
      PMBI_SMTP_USERNAME: ${PMBI_SMTP_USERNAME:-}
      PMBI_SMTP_PASSWORD: ${PMBI_SMTP_PASSWORD:-}
      PMBI_SMTP_FROM: ${PMBI_SMTP_FROM:-}
      PMBI_SMTP_USE_TLS: ${PMBI_SMTP_USE_TLS:-1}
      PMBI_SMTP_USE_SSL: ${PMBI_SMTP_USE_SSL:-0}
      PMBI_MAIL_PROVIDER: ${PMBI_MAIL_PROVIDER:-smtp}
      PMBI_RESEND_API_KEY: ${PMBI_RESEND_API_KEY:-}
      PMBI_RESEND_FROM: ${PMBI_RESEND_FROM:-}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_JWT_KEY: ${CLERK_JWT_KEY:-}
      CLERK_ISSUER: ${CLERK_ISSUER:-}
      CLERK_AUDIENCE: ${CLERK_AUDIENCE:-}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-http://127.0.0.1:8080}
      CLERK_ADMIN_EMAILS: ${CLERK_ADMIN_EMAILS:-}
      CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: ${CLERK_SIGN_IN_FALLBACK_REDIRECT_URL:-/app/dashboard}
      CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: ${CLERK_SIGN_UP_FALLBACK_REDIRECT_URL:-/app/dashboard}
    ports:
      - "${PMBI_BIND_IP:-127.0.0.1}:8080:8080"
    volumes:
      - ./data:/app/data
      - ./backend:/app/backend:ro
      - ./frontend:/app/frontend:ro
      - ./deploy:/app/deploy:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  autobot:
    build:
      context: ../code/auto_bot
    container_name: pmbi-autobot
    init: true
    ipc: host
    depends_on:
      - crm
    environment:
      WEB_UI_HOST: 0.0.0.0
      WEB_UI_PORT: 8765
      WEB_UI_MAX_UPLOAD_MB: ${WEB_UI_MAX_UPLOAD_MB:-100}
      PMBI_CRM_URL: http://crm:8080
      PMBI_PUBLIC_BASE_URL: ${PMBI_PUBLIC_BASE_URL:-http://127.0.0.1:8080}
      PMBI_CRM_PUBLIC_URL: ${PMBI_CRM_PUBLIC_URL:-}
      PMBI_CRM_LOGIN: ${PMBI_CRM_LOGIN:-admin}
      PMBI_CRM_PASSWORD: ${PMBI_CRM_PASSWORD:-}
      PMBI_CRM_MAX_MATERIALS: ${PMBI_CRM_MAX_MATERIALS:-10000}
      REPORT_SITE_PUBLIC_BASE_URL: ${REPORT_SITE_PUBLIC_BASE_URL:-http://127.0.0.1:8765}
      WEB_UI_PUBLIC_BASE_URL: ${WEB_UI_PUBLIC_BASE_URL:-http://127.0.0.1:8765}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_SPOOL_ON_FAIL: ${TELEGRAM_SPOOL_ON_FAIL:-1}
      SKIP_PERPLEXITY_TXT: ${SKIP_PERPLEXITY_TXT:-1}
      RUN_MARKET: ${RUN_MARKET:-1}
      MARKET_MAX_ROWS: ${MARKET_MAX_ROWS:-0}
      MARKET_PAUSE_SEC: ${MARKET_PAUSE_SEC:-18}
      MARKET_SOURCES: ${MARKET_SOURCES:-web,avito}
      MARKET_AVITO_BROWSER: ${MARKET_AVITO_BROWSER:-1}
      MARKET_AVITO_HEADLESS: ${MARKET_AVITO_HEADLESS:-1}
      MARKET_AVITO_MAX_REQUESTS_PER_RUN: ${MARKET_AVITO_MAX_REQUESTS_PER_RUN:-2}
      MARKET_AVITO_MAX_REQUESTS_PER_DAY: ${MARKET_AVITO_MAX_REQUESTS_PER_DAY:-3}
      MARKET_AVITO_MIN_INTERVAL_SEC: ${MARKET_AVITO_MIN_INTERVAL_SEC:-90}
      MARKET_AVITO_BLOCK_COOLDOWN_SEC: ${MARKET_AVITO_BLOCK_COOLDOWN_SEC:-43200}
      MARKET_AVITO_CACHE_TTL_SEC: ${MARKET_AVITO_CACHE_TTL_SEC:-2592000}
      MARKET_AVITO_MAX_SCROLLS: ${MARKET_AVITO_MAX_SCROLLS:-2}
      MARKET_AVITO_SCROLL_TARGET_CARDS: ${MARKET_AVITO_SCROLL_TARGET_CARDS:-25}
      MARKET_AVITO_SCROLL_DELAY_MIN_SEC: ${MARKET_AVITO_SCROLL_DELAY_MIN_SEC:-5}
      MARKET_AVITO_SCROLL_DELAY_MAX_SEC: ${MARKET_AVITO_SCROLL_DELAY_MAX_SEC:-9}
      MARKET_CACHE_TTL_SEC: ${MARKET_CACHE_TTL_SEC:-604800}
      MARKET_AGENT_TOKEN: ${MARKET_AGENT_TOKEN:-}
      MAIN_MAX_PAGES: ${MAIN_MAX_PAGES:-2}
      MAIN_MAX_TENDERS: ${MAIN_MAX_TENDERS:-15}
      MAIN_DAYS_BACK: ${MAIN_DAYS_BACK:-60}
    ports:
      - "${PMBI_AUTOBOT_BIND_IP:-127.0.0.1}:8765:8765"
    volumes:
      - ../code/auto_bot/data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=5)); raise SystemExit(0 if data.get('ok') is True else 1)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
    restart: unless-stopped
